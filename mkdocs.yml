site_name: Tony Format
# The repository, linked with its icon from the header of every page. edit_uri is
# empty so the link is to the repository rather than a per-page "Edit on GitHub",
# whose default path names a master branch this repository does not have.
repo_url: https://github.com/signadot/tony-format
repo_name: GitHub
edit_uri: ""
nav:
- Format:
  - tony.md
  - ir.md
- Schema:
  - tonyschema/index.md
  - tonyschema/schema.md
  - tonyschema/contexts.md
  - tonyschema/tags.md
  - tonyschema/validation.md
- Tools:
  # o/ is generated by `o docs` (make docs-o); README.md is its index, and the
  # command pages are linked from there rather than listed here, so adding a
  # command does not need a nav edit. Hand-written pages may live here too, but
  # must not be named README.md or o-*.md -- and a page about a command belongs
  # in that command's description, which is where o/build.md came from and where
  # it went back to, rather than beside the generated page as a second copy.
  # The language server is the exception: it is listed as a tool of its own,
  # because it is found by what it does for an editor, not by the command name.
  - o: o/README.md
  - LSP: o/o-system-lsp.md
  - Golang: gomap.md
  - logd: logd/index.md
  - 'logd: What a write must be': logd/writes.md
  - 'logd: Keyed arrays': logd/keyed.md
  - 'logd: Configuring compaction': logd/compaction.md
  - 'logd: Retention': logd/retention.md
  - docd: docd/index.md
  - 'docd: Mounts & routing': docd/mounts.md
  - 'docd: Composition — reads & watches': docd/composition.md
  - 'docd: Multi-mount transactions': docd/transactions.md
  - 'Extra-Format Encoding': extraformat.md
- Reference:
  - build-eval.md
  - 'Tags': generated/index.md
  - matchpatch.md
  - 'logd: The session protocol': logd/session.md

# The tony lexer lives under docs/ so that a change to it triggers the docs
# workflow, but installing it leaves build artifacts next to it, and those are
# not documentation.
# articles/ holds long-form pieces written for publication elsewhere, each carrying
# its destination's front matter. A draft is excluded from the site, so that
# `status: draft` in the front matter and what the site serves cannot disagree; a
# published one loses the line here and gains a nav entry.
exclude_docs: |
  sketchy/pygments-tony/build/
  sketchy/pygments-tony/*.egg-info/
  sketchy/pygments-tony/__pycache__/
  articles/logd-document-store.md

theme:
  name: mkdocs
  highlightjs: false

markdown_extensions:
  - tables: {}
  - toc:
      permalink: '#'
  - admonition
  # Use pymdownx.highlight - works better with superfences than codehilite
  - pymdownx.highlight:
      use_pygments: true
      css_class: codehilite
      anchor_linenums: true
  - pymdownx.superfences:
      # Custom fence for mermaid diagrams only
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
      # Explicitly tell superfences to use pymdownx.highlight for other languages
      # This ensures tony code blocks get pygments highlighting
      # When a language is not in custom_fences, superfences will use the highlighter
      # specified here (or default to pymdownx.highlight if available)

extra_css:
  - pygments.css
plugins:
  - mermaid2
